[project]
name = "foundry"
version = "0.1.0"
description = "Unified Autonomous AI Development Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "sdlc-models",
    "sdlc-store",
    "sdlc-phases",
    "sdlc-judge",
    "sdlc-debate",
    "sdlc-mcp",
    "textual>=0.80.0",
    "rich>=13.0.0",
]
[project.optional-dependencies]
server = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
orchestrator = []
observability = ["fastapi>=0.115.0"]
notifications = ["httpx>=0.27.0"]
all = ["foundry[server]", "foundry[orchestrator]", "foundry[observability]", "foundry[notifications]"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
include = ["foundry*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
