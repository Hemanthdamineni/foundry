[project]
name = "sdlc-mcp"
version = "0.1.0"
description = "MCP server exposing SDLC judge and debate as tools/resources"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0.0", "mcp>=1.0.0", "httpx>=0.27.0", "sdlc-models", "sdlc-store", "sdlc-phases", "sdlc-judge", "sdlc-debate"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sdlc_mcp*"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.9.0"]

[project.scripts]
sdlc-mcp = "sdlc_mcp.cli:main"
